name: Validate port sources
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify_reference.py
      - name: Check legacy shell syntax without executing it
        run: find reference -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: git diff --check
